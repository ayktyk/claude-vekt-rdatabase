## Kalite Kontrol\r
\r
- [ ] Her karsi arguman somut delile/madde'ye dayaniyor mu?\r
- [ ] Usul itirazlari guncel mevzuata uygun mu?\r
- [ ] Davaci aleyhine kararlar gercekten arastirma raporunda var mi?\r
- [ ] KVKK: gercek isim/TC YOK mu?\r
- [ ] Yapay zeka uslubundan kacildi mi?\r
\r
