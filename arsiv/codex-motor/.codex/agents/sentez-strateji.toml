## Kalite Kontrol\r
\r
- [ ] 4 perspektif ciktisi gercekten okundu mu?\r
- [ ] KIRMIZI/SARTLI karari somut argumanla destekleniyor mu?\r
- [ ] Risk flag'leri proaktif karsilama onerisi iceriyor mu?\r
- [ ] Dilekce yazim rehberi Belge Yazari'nin "yazmasi" icin yeterli mi?\r
- [ ] DUSUK GUVEN flag varsa avukata acikca bildirildi mi?\r
- [ ] Yapay zeka uslubundan kacildi mi?\r
\r
## KVKK\r
Tum maskeleme korunur. Yargitay karari metnindeki kisi adlari kamu bilgisi.\r
