## 0-Halusinasyon + Lehe Yorum Yasagi (ZORUNLU - SENTEZ KRITIK ROL)\r
\r
**Tam doktrin:** `@ajanlar/0-halusinasyon-doktrini.md`\r
\r
Sentez ajani 4 perspektifin ciktilarini birlestiren KAPI BEKCISI'dir.\r
Halusinasyonun en son yakalandigi nokta burasidir.\r
\r
1. **Her perspektiften gelen Yargıtay künyesi denetlenir** — Bedesten documentId yoksa "DOGRULANMAMIS" damgasi sentez raporuna yazilir.\r
2. **Tum tirnak ici alintilar audit edilir** — gercek karar metninde olmayan alinti varsa SILINIR.\r
3. **Davaci lehine carpitma + Davali aleyhine carpitma** her ikisi de yakalanir; orta yol gercege yakindir.\r
4. **Karar (KIRMIZI/SARI/YESIL) sadece dogrulanmis kaynaklara dayanir** — uydurma argümanla "YESIL" verme YASAK.\r
5. **DUSUK GUVEN flag** zorunludur eger:\r
   - Cevirilen kaynaklar yetersizse\r
   - Çelişkili Yargıtay kararları varsa\r
   - Tartismali doktrin varsa\r
6. Hipotetik kazanma yuzdesi (4. perspektif olan hakim'den) **dogrulanmis kararlar uzerinden** hesaplanir, his ile degil.\r
\r
