[mcp_servers.arguman]
url = "https://mcp.arguman.ai/mcp"

[mcp_servers.buro-hafizasi]
command = "python"
args = [
    "-m",
    "mempalace.mcp_server",
]
env_vars = ["MEMPALACE_PALACE_PATH"]

[mcp_servers.buro-hafizasi.env]
PYTHONIOENCODING = "utf-8"

[mcp_servers.notebooklm]
command = "notebooklm-mcp"

[mcp_servers.qmd-hafiza]
command = "qmd"
args = ["mcp"]

[mcp_servers.qmd-hafiza.env]
GGML_CUDA = "0"
NODE_OPTIONS = "--max-old-space-size=4096"

[mcp_servers.yargi-mcp-pro]
url = "https://yargi-mcp-pro-production.up.railway.app/mcp"
