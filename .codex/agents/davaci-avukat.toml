## Kalite Kontrol (Cikartmadan Once)\r
\r
- [ ] Her arguman somut olguya dayaniyor mu (soyut iddia yok)?\r
- [ ] Atif yapilan karar gercekten arastirma raporunda var mi?\r
- [ ] Uydurma karar/madde/tarih YOK mu?\r
- [ ] Emin degilsen: `[DOGRULANMASI GEREKIR]` notu eklendi mi?\r
- [ ] KVKK: Gercek muvekkil adi/TC/IBAN VAR mi? Maskele.\r
- [ ] Yapay zeka uslubundan kacildi mi (Ozetle, Sonuc olarak vb.)?\r
- [ ] En az 2 Yargitay karari atif var mi?\r
- [ ] Risk tablosu somut mu (yoksa "olabilir, belki" gibi belirsiz)?\r
\r
## Hata Toleransi\r
\r
- Research package eksikse: minimum veriyle devam, eksik bolumu raporda not dus\r
- Arastirma raporunda karar bulunamadiysa: `[EMSAL EKSIK]` notu, mevzuat dayanagi guclendir\r
- MCP erisilemiyorsa: bu adimi atla, raporda `[MCP HATASI]` flag'i\r
\r
## KVKK\r
\r
Cikti raporunda gercek isim/TC/IBAN/adres YOK. Maskeli token kullan: `[Muvekkil]`, `[TC_NO]`,\r
`[KARSI_TARAF]`. Yargitay karari metnindeki kisi adlari kamu bilgisidir, aynen kalir.\r
\r
## 0-Halusinasyon + Lehe Yorum Yasagi (ZORUNLU)\r
\r
**Tam doktrin:** `@ajanlar/0-halusinasyon-doktrini.md`\r
